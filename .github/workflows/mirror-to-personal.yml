name: Mirror to personal repo

# Whenever main is updated on this (org) repo, push it to
# JINXED20/main-website so Vercel (free plan) can deploy it.
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  mirror:
    # The personal repo receives this file too; only mirror from the org repo.
    if: github.repository == 'Ordex-team/Ordex-website'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without this, checkout stores GITHUB_TOKEN as an auth header for
          # every github.com URL, which overrides MIRROR_TOKEN and the push to
          # JINXED20/main-website is rejected (403 for github-actions[bot]).
          persist-credentials: false

      - name: Push main to personal repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git push --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/JINXED20/main-website.git" \
            HEAD:main
